services:
  consensus-node1:
    build:
      context: .
      dockerfile: consensus_node/Dockerfile
    environment:
      NODE_ID: consensus-node1
      BIND_ADDR: "0.0.0.0:6000"
      SELF_ADDR: consensus-node1:6000
      PEERS: consensus-node1:6000,consensus-node2:6000,consensus-node3:6000,consensus-node4:6000,consensus-node5:6000
    volumes:
      - node1-data:/data
    ports:
      - "6001:6000"

