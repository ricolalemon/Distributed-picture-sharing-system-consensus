<!DOCTYPE html>
<html>
<head>
    <title>Distributed Picture Sharing System</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        .controls { margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        .benchmark-btn { background: #ff9800; }
        .benchmark-btn:hover { background: #e68900; }
        select, input[type="file"] { padding: 8px; margin: 5px; }
        .picture-list { margin-top: 20px; }
        .picture-item { padding: 15px; margin: 10px 0; background: #fff; border: 1px solid #ddd; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .picture-info { flex: 1; }
        .picture-actions button { margin: 0 5px; padding: 8px 15px; font-size: 14px; }
        .delete-btn { background: #f44336; }
        .delete-btn:hover { background: #da190b; }
        .like-btn { background: #2196F3; }
        .like-btn:hover { background: #0b7dda; }
        .download-btn { background: #4CAF50; }
        .logs { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 5px; max-height: 300px; overflow-y: auto; }
        .log-entry { padding: 5px; border-bottom: 1px solid #ddd; font-family: monospace; font-size: 12px; }
        .strategy-selector { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Distributed Picture Sharing System</h1>
        
        <div class="controls">
            <div class="strategy-selector">
                <label>Strategy: </label>
                <select id="strategy">
                    <option value="http">HTTP (Layered)</option>
                    <option value="grpc">gRPC (Microservice)</option>
                </select>
            </div>
            
            <div>
                <input type="file" id="fileInput" accept="image/*">
                <button onclick="uploadFile()">Upload Picture</button>
            </div>
            
            <div>
                <input type="text" id="searchInput" placeholder="Enter filename">
                <button onclick="searchPicture()">Search Picture</button>
            </div>
            
            <div>
                <button onclick="refreshList()">Refresh List</button>
            </div>
        </div>
        
        <div class="picture-list">
            <h2>Pictures</h2>
            <div id="pictureContainer"></div>
        </div>
        
        <div class="logs">
            <h2>System Logs</h2>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        let currentStrategy = 'http';
        
        document.getElementById('strategy').addEventListener('change', (e) => {
            currentStrategy = e.target.value;
            refreshList();
        });

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                alert('Please select a file');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('strategy', currentStrategy);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                alert(`Uploaded to node: ${result.node}`);
                refreshList();
                fileInput.value = '';
            } catch (error) {
                alert('Upload failed: ' + error);
            }
        }

        async function searchPicture() {
            const searchInput = document.getElementById('searchInput');
            const filename = searchInput.value;
            if (!filename) {
                alert('Please enter a filename');
                return;
            }
            
            try {
                const response = await fetch(`/search/${filename}?strategy=${currentStrategy}`);
                const result = await response.json();
                
                if (result.found) {
                    alert(`Found on node: ${result.node}\nLikes: ${result.likes}`);
                } else {
                    alert('Picture not found');
                }
            } catch (error) {
                alert('Search failed: ' + error);
            }
        }

        async function downloadPicture(filename) {
            try {
                window.location.href = `/download/${filename}?strategy=${currentStrategy}`;
            } catch (error) {
                alert('Download failed: ' + error);
            }
        }

        async function deletePicture(filename) {
            if (!confirm(`Delete ${filename}?`)) return;
            
            try {
                const response = await fetch(`/delete/${filename}?strategy=${currentStrategy}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('Picture deleted');
                    refreshList();
                } else {
                    alert('Delete failed');
                }
            } catch (error) {
                alert('Delete failed: ' + error);
            }
        }

        async function likePicture(filename) {
            try {
                const response = await fetch(`/like/${filename}?strategy=${currentStrategy}`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    refreshList();
                }
            } catch (error) {
                alert('Like failed: ' + error);
            }
        }

        async function refreshList() {
            try {
                const response = await fetch(`/list?strategy=${currentStrategy}`);
                const pictures = await response.json();
                
                const container = document.getElementById('pictureContainer');
                container.innerHTML = '';
                
                if (Object.keys(pictures).length === 0) {
                    container.innerHTML = '<p>No pictures yet</p>';
                    return;
                }
                
                for (const [filename, meta] of Object.entries(pictures)) {
                    const item = document.createElement('div');
                    item.className = 'picture-item';
                    item.innerHTML = `
                        <div class="picture-info">
                            <strong>${filename}</strong><br>
                            Node: ${meta.node} | Likes: ${meta.likes}
                        </div>
                        <div class="picture-actions">
                            <button class="download-btn" onclick="downloadPicture('${filename}')">Download</button>
                            <button class="like-btn" onclick="likePicture('${filename}')">👍 Like</button>
                            <button class="delete-btn" onclick="deletePicture('${filename}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(item);
                }
            } catch (error) {
                console.error('Refresh failed:', error);
            }
        }

        async function refreshLogs() {
            try {
                const response = await fetch('/logs');
                const logs = await response.json();
                
                const container = document.getElementById('logContainer');
                container.innerHTML = '';
                
                logs.forEach(log => {
                    const entry = document.createElement('div');
                    entry.className = 'log-entry';
                    entry.textContent = `[${log.time}] ${log.message}`;
                    container.appendChild(entry);
                });
                
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error('Log refresh failed:', error);
            }
        }

        async function runBenchmark() {
            alert('Benchmark running... This may take a few minutes');
            
            try {
                const response = await fetch('/benchmark', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        strategy: currentStrategy,
                        workload: 100
                    })
                });
                const results = await response.json();
                
                let message = 'Benchmark Results:\n\n';
                for (const [op, data] of Object.entries(results)) {
                    message += `${op}:\n`;
                    message += `  Avg Latency: ${data.latency.length > 0 ? (data.latency.reduce((a,b) => a+b) / data.latency.length).toFixed(2) : 'N/A'} ms\n`;
                    message += `  Throughput: ${data.throughput} ops/sec\n\n`;
                }
                alert(message);
            } catch (error) {
                alert('Benchmark failed: ' + error);
            }
        }

        // Auto-refresh
        setInterval(refreshList, 5000);
        setInterval(refreshLogs, 2000);
        refreshList();
        refreshLogs();
    </script>
</body>
</html>
